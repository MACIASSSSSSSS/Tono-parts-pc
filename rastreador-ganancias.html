<style>
  @import url('https://fonts.googleapis.com/css2?family=Space+Grotesk:wght@500;600;700&family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500;600&display=swap');

  :root{
    --bg:#14161a;
    --panel:#1c1f25;
    --panel2:#20242b;
    --line:#2a2f38;
    --text:#e9e7e1;
    --dim:#8b919c;
    --gold:#c9974f;
    --gold-dim:#8a6d43;
    --trace:#6b9080;
    --danger:#c9704f;
  }
  *{box-sizing:border-box; margin:0; padding:0;}
  body{
    background:var(--bg);
    color:var(--text);
    font-family:'IBM Plex Sans', sans-serif;
    min-height:100vh;
    padding:20px 14px 60px;
  }
  .wrap{max-width:720px; margin:0 auto;}

  header{margin-bottom:22px;}
  .eyebrow{
    font-family:'IBM Plex Mono', monospace;
    font-size:11px;
    letter-spacing:.14em;
    color:var(--gold);
    text-transform:uppercase;
    margin-bottom:6px;
  }
  h1{
    font-family:'Space Grotesk', sans-serif;
    font-size:26px;
    font-weight:700;
    letter-spacing:-.01em;
  }
  .sub{color:var(--dim); font-size:13px; margin-top:4px;}

  /* Summary strip styled like a RAM module edge connector */
  .strip{
    display:flex;
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    overflow:hidden;
    margin:20px 0 24px;
  }
  .stat{flex:1; padding:14px 10px; text-align:center; position:relative;}
  .stat:not(:last-child)::after{
    content:'';
    position:absolute; right:0; top:12px; bottom:12px; width:1px;
    background:var(--line);
  }
  .stat .label{font-family:'IBM Plex Mono',monospace; font-size:10px; color:var(--dim); letter-spacing:.06em; text-transform:uppercase;}
  .stat .value{font-family:'IBM Plex Mono',monospace; font-size:18px; font-weight:600; margin-top:5px;}
  .stat .value.pos{color:var(--trace);}
  .stat .value.neg{color:var(--danger);}
  .stat .value.gold{color:var(--gold);}
  .pins{height:4px; background:repeating-linear-gradient(90deg,var(--gold) 0 6px, transparent 6px 10px); opacity:.55;}

  /* Form card */
  .card{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    padding:16px;
    margin-bottom:20px;
  }
  .card h2{font-family:'Space Grotesk',sans-serif; font-size:15px; font-weight:600; margin-bottom:12px;}
  .row2{display:grid; grid-template-columns:1fr 1fr; gap:10px;}
  .field{margin-bottom:10px;}
  .field label{display:block; font-size:11px; color:var(--dim); margin-bottom:4px; font-family:'IBM Plex Mono',monospace;}
  .field input{
    width:100%;
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--text);
    padding:9px 10px;
    border-radius:6px;
    font-size:14px;
    font-family:'IBM Plex Sans',sans-serif;
  }
  .field input:focus{outline:none; border-color:var(--gold-dim);}
  .field input::placeholder{color:#565b64;}

  button{
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    letter-spacing:.04em;
    cursor:pointer;
    border:none;
    border-radius:6px;
    padding:10px 14px;
  }
  .btn-add{
    width:100%;
    background:var(--gold);
    color:#1a1206;
    font-weight:600;
    margin-top:4px;
  }
  .btn-add:active{opacity:.85;}

  /* Filters */
  .filters{display:flex; gap:8px; margin-bottom:12px;}
  .filters button{
    background:transparent;
    border:1px solid var(--line);
    color:var(--dim);
    flex:1;
  }
  .filters button.active{
    border-color:var(--gold-dim);
    color:var(--gold);
    background:rgba(201,151,79,0.08);
  }

  /* Items */
  .item{
    background:var(--panel);
    border:1px solid var(--line);
    border-radius:10px;
    margin-bottom:10px;
    overflow:hidden;
  }
  .item-body{padding:13px 14px;}
  .item-top{display:flex; justify-content:space-between; align-items:flex-start; gap:8px;}
  .item-name{font-weight:600; font-size:14.5px;}
  .item-date{font-family:'IBM Plex Mono',monospace; font-size:10.5px; color:var(--dim); margin-top:2px;}
  .badge{
    font-family:'IBM Plex Mono',monospace;
    font-size:10px;
    padding:3px 8px;
    border-radius:20px;
    white-space:nowrap;
    text-transform:uppercase;
    letter-spacing:.04em;
  }
  .badge.inv{background:rgba(139,145,156,.15); color:var(--dim);}
  .badge.sold{background:rgba(107,144,128,.18); color:var(--trace);}
  .item-nums{
    display:flex;
    gap:16px;
    margin-top:10px;
    font-family:'IBM Plex Mono',monospace;
    font-size:12px;
    flex-wrap:wrap;
  }
  .item-nums div span{display:block; color:var(--dim); font-size:9.5px; text-transform:uppercase; letter-spacing:.05em;}
  .item-nums .g-pos{color:var(--trace);}
  .item-nums .g-neg{color:var(--danger);}
  .item-actions{display:flex; gap:8px; margin-top:11px;}
  .item-actions button{
    background:var(--panel2);
    border:1px solid var(--line);
    color:var(--text);
    font-size:11px;
    padding:7px 10px;
    flex:1;
  }
  .item-actions button.del{color:var(--danger);}
  .item-pins{height:3px; background:repeating-linear-gradient(90deg,var(--gold-dim) 0 5px, transparent 5px 9px); opacity:.4;}

  .empty{
    text-align:center;
    color:var(--dim);
    font-size:13px;
    padding:30px 10px;
    font-family:'IBM Plex Mono',monospace;
  }

  /* Sell modal */
  .overlay{
    position:fixed; inset:0; background:rgba(0,0,0,.6);
    display:none; align-items:flex-end; justify-content:center; z-index:10;
  }
  .overlay.open{display:flex;}
  .modal{
    background:var(--panel); border:1px solid var(--line); border-radius:14px 14px 0 0;
    width:100%; max-width:720px; padding:18px 16px 24px;
  }
  .modal h3{font-family:'Space Grotesk',sans-serif; font-size:16px; margin-bottom:12px;}
  .modal-actions{display:flex; gap:10px; margin-top:6px;}
  .modal-actions button{flex:1;}
  .btn-cancel{background:transparent; border:1px solid var(--line); color:var(--dim);}
  .btn-confirm{background:var(--trace); color:#0e1512; font-weight:600;}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Toño PC Parts · Soacha</div>
    <h1>Rastreador de ganancias</h1>
    <div class="sub">Compra, vende y mira la plata real que estás dejando.</div>
  </header>

  <div class="strip" id="summaryStrip">
    <div class="stat"><div class="label">Invertido</div><div class="value gold" id="statInvertido">$0</div></div>
    <div class="stat"><div class="label">Ganancia neta</div><div class="value" id="statGanancia">$0</div></div>
    <div class="stat"><div class="label">Margen prom.</div><div class="value" id="statMargen">0%</div></div>
  </div>
  <div class="pins"></div>

  <div class="card">
    <h2>+ Agregar producto</h2>
    <div class="field">
      <label>Producto</label>
      <input type="text" id="inProducto" placeholder="Ej: RAM Corsair Vengeance 8GB DDR4">
    </div>
    <div class="row2">
      <div class="field">
        <label>Costo compra (COP)</label>
        <input type="number" id="inCosto" placeholder="80000">
      </div>
      <div class="field">
        <label>Gastos extra (COP)</label>
        <input type="number" id="inGastos" placeholder="5000">
      </div>
    </div>
    <div class="field">
      <label>Fecha compra</label>
      <input type="date" id="inFecha">
    </div>
    <button type="button" class="btn-add" id="btnAgregar">Agregar al inventario</button>
  </div>

  <div class="filters">
    <button type="button" class="active" data-f="todos">Todos</button>
    <button type="button" data-f="inventario">En inventario</button>
    <button type="button" data-f="vendidos">Vendidos</button>
  </div>

  <div id="lista"></div>
</div>

<div class="overlay" id="overlay">
  <div class="modal">
    <h3>Registrar venta</h3>
    <div class="field">
      <label>Precio de venta (COP)</label>
      <input type="number" id="inPrecioVenta" placeholder="120000">
    </div>
    <div class="field">
      <label>Fecha de venta</label>
      <input type="date" id="inFechaVenta">
    </div>
    <div class="modal-actions">
      <button type="button" class="btn-cancel" id="btnCancelarVenta">Cancelar</button>
      <button type="button" class="btn-confirm" id="btnConfirmarVenta">Confirmar venta</button>
    </div>
  </div>
</div>

<script>
const KEY = 'toño-pc-parts-registros';
let registros = [];
let filtroActual = 'todos';
let ventaEnCurso = null;

function fmt(n){
  return '$' + Math.round(n).toLocaleString('es-CO');
}

function cargar(){
  try{
    const raw = localStorage.getItem(KEY);
    registros = raw ? JSON.parse(raw) : [];
  }catch(e){
    registros = [];
  }
  render();
}

function guardar(){
  try{
    localStorage.setItem(KEY, JSON.stringify(registros));
  }catch(e){
    console.error('No se pudo guardar', e);
  }
}

function calcularResumen(){
  let invertido = 0, gananciaNeta = 0, margenes = [];
  registros.forEach(r=>{
    const costoTotal = Number(r.costo) + Number(r.gastos||0);
    if(!r.vendido){
      invertido += costoTotal;
    } else {
      const g = Number(r.precioVenta) - costoTotal;
      gananciaNeta += g;
      margenes.push(costoTotal > 0 ? (g/costoTotal)*100 : 0);
    }
  });
  const margenProm = margenes.length ? margenes.reduce((a,b)=>a+b,0)/margenes.length : 0;
  document.getElementById('statInvertido').textContent = fmt(invertido);
  const gEl = document.getElementById('statGanancia');
  gEl.textContent = fmt(gananciaNeta);
  gEl.className = 'value ' + (gananciaNeta >= 0 ? 'pos' : 'neg');
  document.getElementById('statMargen').textContent = margenProm.toFixed(0) + '%';
}

function render(){
  calcularResumen();
  const lista = document.getElementById('lista');
  let items = [...registros].sort((a,b)=> (b.fecha||'').localeCompare(a.fecha||''));
  if(filtroActual === 'inventario') items = items.filter(r=>!r.vendido);
  if(filtroActual === 'vendidos') items = items.filter(r=>r.vendido);

  if(items.length === 0){
    lista.innerHTML = '<div class="empty">Todavía no hay nada aquí. Agrega tu primer producto arriba.</div>';
    return;
  }

  lista.innerHTML = items.map(r=>{
    const costoTotal = Number(r.costo) + Number(r.gastos||0);
    let numsHtml = `
      <div><span>Costo total</span>${fmt(costoTotal)}</div>
    `;
    if(r.vendido){
      const g = Number(r.precioVenta) - costoTotal;
      const margen = costoTotal > 0 ? (g/costoTotal*100) : 0;
      numsHtml += `
        <div><span>Venta</span>${fmt(r.precioVenta)}</div>
        <div><span>Ganancia</span><span class="${g>=0?'g-pos':'g-neg'}" style="display:inline;font-size:12px;">${fmt(g)}</span></div>
        <div><span>Margen</span>${margen.toFixed(0)}%</div>
      `;
    }
    return `
      <div class="item" data-id="${r.id}">
        <div class="item-body">
          <div class="item-top">
            <div>
              <div class="item-name">${r.producto}</div>
              <div class="item-date">Compra: ${r.fecha || '—'}${r.vendido ? ' · Venta: '+(r.fechaVenta||'—') : ''}</div>
            </div>
            <span class="badge ${r.vendido?'sold':'inv'}">${r.vendido?'Vendido':'En inventario'}</span>
          </div>
          <div class="item-nums">${numsHtml}</div>
          <div class="item-actions">
            ${!r.vendido ? `<button type="button" class="marcarVender">Marcar como vendido</button>` : ''}
            <button type="button" class="del">Eliminar</button>
          </div>
        </div>
        <div class="item-pins"></div>
      </div>
    `;
  }).join('');

  lista.querySelectorAll('.marcarVender').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const id = e.target.closest('.item').dataset.id;
      abrirModalVenta(id);
    });
  });
  lista.querySelectorAll('.del').forEach(btn=>{
    btn.addEventListener('click', (e)=>{
      const id = e.target.closest('.item').dataset.id;
      registros = registros.filter(r=>r.id !== id);
      guardar();
      render();
    });
  });
}

function abrirModalVenta(id){
  ventaEnCurso = id;
  document.getElementById('inPrecioVenta').value = '';
  document.getElementById('inFechaVenta').value = new Date().toISOString().slice(0,10);
  document.getElementById('overlay').classList.add('open');
}

document.getElementById('btnCancelarVenta').addEventListener('click', ()=>{
  document.getElementById('overlay').classList.remove('open');
  ventaEnCurso = null;
});

document.getElementById('btnConfirmarVenta').addEventListener('click', ()=>{
  const precio = document.getElementById('inPrecioVenta').value;
  const fecha = document.getElementById('inFechaVenta').value;
  if(!precio){ return; }
  const r = registros.find(x=>x.id === ventaEnCurso);
  if(r){
    r.vendido = true;
    r.precioVenta = Number(precio);
    r.fechaVenta = fecha;
    guardar();
    render();
  }
  document.getElementById('overlay').classList.remove('open');
  ventaEnCurso = null;
});

document.getElementById('btnAgregar').addEventListener('click', ()=>{
  const producto = document.getElementById('inProducto').value.trim();
  const costo = document.getElementById('inCosto').value;
  const gastos = document.getElementById('inGastos').value || 0;
  const fecha = document.getElementById('inFecha').value || new Date().toISOString().slice(0,10);
  if(!producto || !costo){
    alert('Ponle al menos el nombre del producto y el costo de compra.');
    return;
  }
  registros.push({
    id: 'r_' + Date.now(),
    producto, costo: Number(costo), gastos: Number(gastos),
    fecha, vendido:false
  });
  document.getElementById('inProducto').value = '';
  document.getElementById('inCosto').value = '';
  document.getElementById('inGastos').value = '';
  document.getElementById('inFecha').value = '';
  guardar();
  render();
});

document.querySelectorAll('.filters button').forEach(btn=>{
  btn.addEventListener('click', ()=>{
    document.querySelectorAll('.filters button').forEach(b=>b.classList.remove('active'));
    btn.classList.add('active');
    filtroActual = btn.dataset.f;
    render();
  });
});

cargar();
</script>
</body>
</html>
